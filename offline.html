<!DOCTYPE html>
<html lang="uz" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f0f0f">
  <meta name="robots" content="noindex">
  <title>Oflayn — UPG</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <script>(function(){try{var t=localStorage.getItem("upg-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}})();</script>

  <!-- Bu sahifa tarmoqsiz koʻrsatiladi: tashqi shrift/CSS yuklab boʻlmaydi,
       shuning uchun hamma narsa inline va tizim shriftlarida. -->
  <style>
    :root {
      --primary: #FF0096;
      --secondary: #FF3139;
      --bg: #070709;
      --card: #131318;
      --border: rgba(255, 255, 255, 0.09);
      --text: #fcfcfc;
      --muted: #98a2ac;
    }
    [data-theme="light"] {
      --bg: #ffffff;
      --card: #ffffff;
      --border: #e4e7ea;
      --text: #0f0f0f;
      --muted: #49565e;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      text-align: center;
    }
    .wrap { max-width: 380px; }
    .logo {
      font-size: 30px; font-weight: 800; font-style: italic;
      letter-spacing: -0.5px; margin-bottom: 28px;
    }
    .logo span {
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
    }
    .icon {
      width: 76px; height: 76px; margin: 0 auto 22px;
      display: grid; place-items: center;
      border-radius: 50%;
      background: var(--card);
      border: 1px solid var(--border);
    }
    .icon svg {
      width: 34px; height: 34px;
      fill: none; stroke: var(--primary);
      stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
    }
    h1 { font-size: 21px; font-weight: 700; margin-bottom: 10px; letter-spacing: -0.2px; }
    p { color: var(--muted); font-size: 15px; margin-bottom: 26px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 48px; padding: 0 26px;
      border: none; border-radius: 12px;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      color: #fff; font: inherit; font-weight: 600; font-size: 15px;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    .btn:active { transform: scale(0.97); }
    .btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; }
    .hint { margin-top: 22px; font-size: 13px; color: var(--muted); }
    .dot {
      display: inline-block; width: 7px; height: 7px;
      border-radius: 50%; background: var(--muted);
      margin-right: 7px; vertical-align: 1px;
    }
    .dot.on { background: #28c840; }
    @media (prefers-reduced-motion: reduce) {
      .btn { transition: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">UPG<span>RADE</span></div>

    <div class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <path d="M5 12.5a10 10 0 0 1 14 0M8 15.5a6 6 0 0 1 8 0"/>
        <circle cx="12" cy="19" r="1.2" fill="currentColor" stroke="none"/>
        <path d="M3 3l18 18"/>
      </svg>
    </div>

    <h1>Internetga ulanmagansiz</h1>
    <p>
      Bu sahifa hali yuklab olinmagan. Ulanishni tekshiring —
      ilgari ochgan sahifalaringiz oflayn ham ishlaydi.
    </p>

    <button class="btn" type="button" id="retry">Qayta urinish</button>

    <p class="hint" id="status"><span class="dot" id="dot"></span><span id="statusText">Tarmoq yoʻq</span></p>
  </div>

  <script>
    (function () {
      var dot = document.getElementById("dot");
      var text = document.getElementById("statusText");
      var retry = document.getElementById("retry");

      function paint() {
        var on = navigator.onLine;
        dot.classList.toggle("on", on);
        text.textContent = on ? "Ulanish tiklandi" : "Tarmoq yoʻq";
      }

      function go() {
        /* Oflayn sahifa fallback sifatida koʻrsatilgani uchun manzil
           foydalanuvchi soʻragan sahifaniki boʻlib qoladi — reload aynan
           oʻshani qayta urinadi. */
        location.reload();
      }

      retry.addEventListener("click", go);
      window.addEventListener("online", function () { paint(); go(); });
      window.addEventListener("offline", paint);
      paint();
    })();
  </script>
</body>
</html>
